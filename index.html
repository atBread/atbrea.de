<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>[atBread]</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/board.css">
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.xrbk.cn/fonts/HarmonyOS_Sans_SC/result.css" rel="stylesheet">
    <style>
        #morphLayer {
  position: fixed;
  z-index: 999998;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  display: none;
  will-change: left, top, width, height, border-radius, opacity, background-color;
}
#morphLayer.visible { opacity: 1; }
    </style>
</head>
<body>
<div class="wrap-box" id="wrap">
    <div class="main-view">
        <div class="canvas-wrapper" id="wrapper">
            <canvas id="dotCanvas"></canvas>
        </div></div></div>

<div class="scroll-mask" id="mask">
    <div class="mask-inner">
        <mdui-button id="goBtn" variant="filled" icon="download" ripple>徐语</mdui-button>
        <div id="morphLayer"></div><h1> </h1>
        <mdui-button icon="functions" href="./prompt" target="_blank">提词</mdui-button><h1> </h1>
        <mdui-button icon="functions" href="Https://cps.HFC2307.top/" target="_blank">手速</mdui-button><h1> </h1>
        <mdui-divider></mdui-divider>
        <mdui-button icon="architecture" end-icon="coffee" href="Https://HFC2307.top/" target="_blank">追忆</mdui-button><h1> </h1>
        <mdui-button icon="search" end-icon="document_scanner" href="Https://www.mdui.org/" target="_blank">主题</mdui-button>
    </div>
</div>

<svg class="v-arrow" id="vSvg" viewBox="0 0 64 32" fill="none">
    <path d="M4 4L24 28L44 4" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<script src="./src/swipe.js"></script>
<script src="./src/wave.js"></script>
<script>
    goBtn.addEventListener('click', () => {
  const rect = goBtn.getBoundingClientRect();
  const cs = getComputedStyle(goBtn);
  const bg = cs.backgroundColor || '#006463';
  const radius = cs.borderRadius || '8px';

  // 同源，sessionStorage 直接可用
  sessionStorage.setItem('morphFrom', JSON.stringify({
    x: rect.left, y: rect.top, w: rect.width, h: rect.height,
    bg, radius,
    to: '#ffffff'  // 目标页背景色
  }));

  // 撑开动画
  const el = morphLayer;
  el.style.transition = 'none';
  el.style.display = 'block';
  el.style.background = bg;
  el.style.opacity = '1';
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.width = rect.width + 'px';
  el.style.height = rect.height + 'px';
  el.style.borderRadius = radius;
  void el.offsetWidth;

  el.classList.add('visible');
  el.style.transition =
    'left 600ms cubic-bezier(0.22,1,0.36,1), top 600ms cubic-bezier(0.22,1,0.36,1), ' +
    'width 600ms cubic-bezier(0.22,1,0.36,1), height 600ms cubic-bezier(0.22,1,0.36,1), ' +
    'border-radius 600ms cubic-bezier(0.22,1,0.36,1), background-color 600ms cubic-bezier(0.22,1,0.36,1)';
  requestAnimationFrame(() => {
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = window.innerWidth + 'px';
    el.style.height = window.innerHeight + 'px';
    el.style.borderRadius = '0px';
    el.style.background = '#ffffff';
  });

  setTimeout(() => {
    location.href = '/xvyu';
  }, 650);
});
</script>
</body>
</html>
