<script>
(function initMorphIn() {
  const raw = sessionStorage.getItem('morphFrom');
  if (!raw) {
    ocument.getElementById('pageContent').style.opacity = '1';
    return;
  }
  sessionStorage.removeItem('morphFrom');

  let data;
  try { data = JSON.parse(raw); } catch (_) { document.body.style.opacity = '1'; return; }

  const el = document.getElementById('morphLayer');
  el.style.transition = 'none';
  el.style.display = 'block';
  el.style.background = data.bg;
  el.style.opacity = '1';
  el.style.left = data.x + 'px';
  el.style.top = data.y + 'px';
  el.style.width = data.w + 'px';
  el.style.height = data.h + 'px';
  el.style.borderRadius = data.radius;
  void el.offsetWidth;

  el.classList.add('visible');
  el.style.transition =
    'left 600ms cubic-bezier(0.22,1,0.36,1), top 600ms cubic-bezier(0.22,1,0.36,1), ' +
    'width 600ms cubic-bezier(0.22,1,0.36,1), height 600ms cubic-bezier(0.22,1,0.36,1), ' +
    'border-radius 600ms cubic-bezier(0.22,1,0.36,1), background-color 600ms cubic-bezier(0.22,1,0.36,1)';
  requestAnimationFrame(() => {
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = window.innerWidth + 'px';
    el.style.height = window.innerHeight + 'px';
    el.style.borderRadius = '0px';
    el.style.background = data.to;
  });

  setTimeout(() => {
    ocument.getElementById('pageContent').style.opacity = '1';
    el.style.transition = 'opacity 200ms ease';
    el.style.opacity = '0';
    setTimeout(() => { el.style.display = 'none'; }, 220);
  }, 650);
})();
</script>
